<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tumo · CQA</title>
  <link rel="stylesheet" href="./styles/cqa.css?v=cleanup-1">
  <script defer src="./scripts/mock-data.js"></script>
  <script defer src="./scripts/service.js"></script>
  <script defer src="./scripts/workspace.js?v=cleanup-1"></script>
</head>
<body>
  <main id="cqa-app">
    <aside class="cqa-sidebar" id="cqa-sidebar">
      <div class="cqa-brand"><img class="cqa-freedom-logo" src="./assets/freedom-logo.png" alt="Freedom Broker"><div><strong>Tumo · CQA</strong><small>Conversation Quality Analytics</small></div></div>
      <p class="cqa-nav-label">РАБОЧАЯ ОБЛАСТЬ</p>
      <nav aria-label="Разделы">
        <button type="button" data-page="dialogs" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Диалоги</button>
        <button type="button" data-page="checklists"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 4-4m2 3h8M4 15l2 2 4-4m2 3h8"/></svg>Чек-листы</button>
        <button type="button" data-page="appeals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8m-8 5h5"/></svg>Апелляции</button>
      </nav>
      <div class="cqa-sidebar-note"><strong>Freedom Broker</strong><small>Аналитика качества диалогов<br>RU · KZ · EN</small></div>
    </aside>
    <div class="cqa-main">
      <header class="cqa-page-header">
        <button type="button" id="cqa-menu-toggle" class="cqa-secondary" aria-controls="cqa-sidebar" aria-expanded="true">☰ Скрыть меню</button>
        <p class="cqa-eyebrow">КОНТРОЛЬ КАЧЕСТВА</p>
        <h1 id="cqa-page-title">Диалоги</h1>
        <p id="cqa-page-description">Загружай диалоги, проверяй оценки и переходи к репликам с доказательствами.</p>
        <button type="button" id="cqa-embed" class="cqa-secondary">Предпросмотр виджета Dynamics 365</button>
      </header>
      <p id="cqa-status" role="status"></p>
      <div id="cqa-content"></div>
    </div>
  </main>
</body>
</html>
